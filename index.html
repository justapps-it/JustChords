<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Just Chords — accordi, accordatore e palco</title>
    <meta name="description" content="Chords app: import from Ultimate Guitar or Accordi e Spartiti, transpose, capo suggestions, chord diagrams, stage mode with autoscroll, tuner, metronome and chord recognition. Open source by JustApps." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://chords.justapps.it/" />
    <meta property="og:title" content="Just Chords — chords, tuner and stage" />
    <meta property="og:description" content="Transpose, capo, diagrams, stage mode, tuner, metronome and chord recognition. All on your device." />
    <meta property="og:image" content="https://chords.justapps.it/icons/icon-512.png" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('justchords-settings') || '{}');
        if (s.theme === 'dark' || s.theme === 'light') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Just Chords needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
